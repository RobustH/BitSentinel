services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: bitsentinel
      POSTGRES_USER: bitsentinel
      POSTGRES_PASSWORD: bitsentinel
    ports:
      - "5432:5432"
    volumes:
      - bitsentinel-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bitsentinel-postgres:
